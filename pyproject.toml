[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rgannotator"
version = "1.0.0"
description = "Identification, rhythm analysis and visualization of circadian clock genes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3",
    "numpy>=1.20",
    "scipy>=1.6",
    "statsmodels>=0.12",
    "matplotlib>=3.4",
    "biopython>=1.78",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
rgannotator = "rgannotator.cli:main"

[tool.setuptools]
packages = ["rgannotator"]
